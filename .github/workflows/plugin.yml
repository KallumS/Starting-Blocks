name: Plugins

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The scripts' own suites, including the window as the plugin runs it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - run: tools/test.sh

  mac:
    needs: test
    runs-on: macos-14
    env:
      NAME: "Starting Blocks"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: plugin/deps
          key: sb-deps-${{ hashFiles('plugin/build.sh') }}
      - name: Build VST3 and CLAP (Apple Silicon and Intel)
        run: EXTRA_TARGETS="StartingBlocks_Standalone sb_smoke" plugin/build.sh
      - name: Smoke test (the script runs, the block plays, the window draws)
        run: mkdir -p shots && plugin/build/sb_smoke "$PWD/shots/smoke.png"
      - name: Sign ad hoc
        run: |
          for p in plugin/out/*; do codesign --force --deep --sign - "$p"; done
          lipo -archs "plugin/out/$NAME.vst3/Contents/MacOS/$NAME"
          lipo -archs "plugin/out/$NAME.clap/Contents/MacOS/$NAME"
      - name: Validate the VST3 (pluginval)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.4 -R Tracktion/pluginval -p '*mac*' -O pluginval.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process \
            --skip-gui-tests --timeout-ms 300000 --validate "plugin/out/$NAME.vst3"
      - name: Validate the CLAP (clap-validator)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir cv && cd cv
          gh release download 0.4.1 -R free-audio/clap-validator -p '*universal*'
          # the release nests its archives; unpack until the program turns up
          for pass in 1 2 3; do
            for f in $(find . -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz'); do
              case "$f" in *.zip) unzip -oq "$f" -d "${f%.zip}.d";; *) mkdir -p "$f.d"; tar xzf "$f" -C "$f.d";; esac
              rm -f "$f"
            done
          done
          CV=$(find . -name clap-validator -type f | head -1)
          [ -n "$CV" ] || { echo "clap-validator not found in:"; find . ; exit 1; }
          chmod +x "$CV"; cd ..
          CV="cv/${CV#./}"
          # The state-invalid tests (loading an empty or random state must fail)
          # are skipped: JUCE's setStateInformation cannot report a failure, so
          # every JUCE plugin fails them. (0.4.1, not 0.3.2: 0.3.2's own host
          # crashed when a plugin asked it for a main-thread callback.)
          # param-conversions is skipped too: this plugin has no parameters, and
          # 0.4.1 divides by their number ("a bug in the validator", it says).
          "$CV" validate --only-failed --exclude '^state-invalid' --exclude '^param-conversions' "plugin/out/$NAME.clap"
      - name: Open the window and take a picture of it
        run: |
          APP=$(find plugin/build -name "$NAME.app" -path '*Standalone*' | head -1)
          codesign --force --deep --sign - "$APP"
          open "$APP"
          sleep 8
          mkdir -p shots
          screencapture -x shots/window.png || true
          osascript -e "quit app \"$NAME\"" || pkill -x "$NAME" || true
      - name: Zip
        run: |
          mkdir -p dist/"$NAME"
          cp -R "plugin/out/$NAME.vst3" "plugin/out/$NAME.clap" dist/"$NAME"/
          cp plugin/INSTALL.txt dist/"$NAME"/
          (cd dist && ditto -c -k --keepParent "$NAME" "$(echo "$NAME" | tr ' ' '-')-macOS.zip")
      - uses: actions/upload-artifact@v4
        with:
          name: Starting-Blocks-macOS
          path: dist/*.zip
      - name: Screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          cd shots
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@localhost add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots of $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
